name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: moneygraph_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d moneygraph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/moneygraph_test
      # Migration tests otherwise fall back to SQLite.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/moneygraph_test
      JWT_SECRET_KEY: ci-only-jwt-secret-key-for-isolated-tests

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest backend/tests
